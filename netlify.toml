# Build, functions, the SPA fallback that `/d/<token>` and `/v/<token>` need, and the
# security headers. Netlify reads this file on every deploy, so a redeploy is one click.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

# Function routes (`/api/diagrams…`, declared in the function's own config) take precedence
# over this rule, so only app routes fall through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security baseline for every page (static files only; the function sets its own headers).
# - Scripts: only our own bundle, no inline scripts. Vite's production index.html has none.
# - Styles: 'unsafe-inline' is for the inline style attributes React Flow and the colour chips
#   need; inline *scripts* stay blocked, which is what the baseline requires.
# - connect-src: this origin (/api/diagrams) plus two read-only GitHub hosts: raw.githubusercontent
#   .com for the theory repo's map files and api.github.com to look up a suggestion's pull
#   request (`/?suggestion=<number>`). Neither call carries a token or a cookie.
# - frame-ancestors 'none' plus X-Frame-Options DENY: the editor cannot be framed.
# - Referrer-Policy no-referrer: edit and view tokens sit in the URL and must not leak to
#   any site a user navigates to from here.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"

# Vite hashes every file under /assets, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
